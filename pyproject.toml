[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tg-ws-proxy"
dynamic=["version"]

description = "Telegram MTProto proxy with a Windows dashboard and authenticated TLS helper"
readme = "README.md"
requires-python = ">=3.11"

license = { name = "MIT", file = "LICENSE" }

authors = [
    { name = "Flowseal" }
]
maintainers = [
    { name = "byShadow64" }
]

keywords = [
    "telegram",
    "tdesktop",
    "proxy",
    "bypass",
    "websocket",
    "mtproto",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Customer Service",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "pyperclip==1.9.0",
    "certifi",
    "httpx[http2]==0.28.1",

    "psutil==7.0.0",
    "cryptography==50.0.2",
    "Pillow==13.0.0",

    "customtkinter==5.2.2",
    "paramiko==5.1.0",
    "pystray==0.19.5",
    "pyobjc-framework-Cocoa>=9.0; platform_system == 'Darwin'",
]

[project.optional-dependencies]
build = ["PyInstaller>=6.11"]
helper-server = ["websockets>=12,<16"]

[project.scripts]
tg-ws-proxy = "proxy.tg_ws_proxy:main"
tg-ws-proxy-tray-win = "windows:main"
tg-ws-proxy-tray-macos = "macos:main"
tg-ws-proxy-tray-linux = "linux:main"

[project.urls]
Source = "https://github.com/byShadow64/tg-proxy"
Issues = "https://github.com/byShadow64/tg-proxy/issues"
Upstream = "https://github.com/Flowseal/tg-ws-proxy"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "ui", "utils"]

[tool.hatch.build.force-include]
"windows.py" = "windows.py"
"macos.py" = "macos.py"
"linux.py" = "linux.py"
"helper_server.py" = "helper_payload_src/helper_server.py"
"helper_pairing.py" = "helper_payload_src/helper_pairing.py"
"helper_registry.py" = "helper_payload_src/helper_registry.py"
"helper_registry_agent.py" = "helper_payload_src/helper_registry_agent.py"
"helper_enrollment.py" = "helper_payload_src/helper_enrollment.py"
"deploy_helper_registry.sh" = "helper_payload_src/deploy_helper_registry.sh"
"helper_requirements.txt" = "helper_payload_src/helper_requirements.txt"
"helper_registry_requirements.txt" = "helper_payload_src/helper_registry_requirements.txt"
"helper_certbot_requirements.txt" = "helper_payload_src/helper_certbot_requirements.txt"
"helper_registry_renew.sh" = "helper_payload_src/helper_registry_renew.sh"
"tg-helper-registry-agent.service" = "helper_payload_src/tg-helper-registry-agent.service"
"tg-helper-registry-agent.timer" = "helper_payload_src/tg-helper-registry-agent.timer"
"tg-helper-enroll.service" = "helper_payload_src/tg-helper-enroll.service"
"tg-helper-certbot-renew.service" = "helper_payload_src/tg-helper-certbot-renew.service"
"tg-helper-certbot-renew.timer" = "helper_payload_src/tg-helper-certbot-renew.timer"
"deploy_helper.sh" = "helper_payload_src/deploy_helper.sh"
"tg-helper.service" = "helper_payload_src/tg-helper.service"
"LICENSE" = "helper_payload_src/LICENSE"
"proxy/__init__.py" = "helper_payload_src/proxy/__init__.py"
"proxy/config.py" = "helper_payload_src/proxy/config.py"
"proxy/balancer.py" = "helper_payload_src/proxy/balancer.py"
"proxy/utils.py" = "helper_payload_src/proxy/utils.py"
"proxy/http_transport.py" = "helper_payload_src/proxy/http_transport.py"
"proxy/route_policy.py" = "helper_payload_src/proxy/route_policy.py"
"proxy/project.py" = "helper_payload_src/proxy/project.py"
"proxy/registry_protocol.py" = "helper_payload_src/proxy/registry_protocol.py"
"proxy/registry_helper.py" = "helper_payload_src/proxy/registry_helper.py"

[tool.hatch.version]
path = "proxy/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["F403", "F405", "B023"]

[tool.ruff.lint.per-file-ignores]
"macos.py" = ["E402"]
