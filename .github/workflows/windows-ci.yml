name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the verified build backend
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r packaging/python-build-backend.lock
      - name: Install project and test dependencies
        run: python -m pip install --no-build-isolation --constraint packaging/python-build-constraints.txt ".[helper-server]" "pytest==9.2.0"
      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -v -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

  android-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android core and pinned SSH dependencies
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain --max-workers=2 :core:test

  release-verifier:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify the isolated release dependency environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/release-verifier-env"
          $verifierPython = "$env:RUNNER_TEMP/release-verifier-env/Scripts/python.exe"
          & $verifierPython -m pip install --only-binary=:all: --require-hashes -r packaging/release-verification-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verifierPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verifierPython -I -B -c "import pathlib, sys; sys.path.insert(0, str(pathlib.Path.cwd())); import certifi, pefile; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; from proxy.http_transport import create_connection, response_with_deadline; from release_tools.github import GitHubClient; from release_tools.bundle import load_bundle; from release_tools.trust import verify_approval; print('Isolated release verifier imports passed')"
          exit $LASTEXITCODE

  build-windows:
    needs: [tests, android-core, release-verifier]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the verified build backend
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r packaging/python-build-backend.lock
      - name: Install project and build dependencies
        run: python -m pip install --no-build-isolation --constraint packaging/python-build-constraints.txt ".[build,helper-server]"
      - name: Record and verify the resolved Windows build environment
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip list --format=json > "$env:RUNNER_TEMP/windows-build-dependencies.json"
      - name: Build Windows executable
        run: python -m PyInstaller packaging/windows.spec --noconfirm
      - name: Check executable
        run: if (!(Test-Path dist/TgWsProxy.exe)) { throw "dist/TgWsProxy.exe was not created" }
      - name: Run packaged application with isolated settings
        run: python packaging/verify_windows_exe.py --exe dist/TgWsProxy.exe
      - name: Prepare public artifacts
        run: python packaging/prepare_release.py --bundle-output dist/publication
      - name: Verify unsigned bundle integrity without executing its source
        run: python -c "from release_tools.bundle import load_bundle; b = load_bundle('dist/publication'); print('Unsigned CI bundle:', b.version, b.bundle_id)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TgWsProxy-unsigned-publication-bundle
          path: dist/publication/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TgWsProxy-windows-build-dependencies
          path: ${{ runner.temp }}/windows-build-dependencies.json
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Worker and its bounded transport
        run: |
          node --check worker/telegram-worker.mjs
          node --test tests/cf_worker_sample.test.mjs

  docker:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned container
        run: docker build -t tg-proxy-ci-local .
      - name: Check an isolated container listener and redacted startup log
        run: |
          set -eu
          trap 'docker rm -f tg-proxy-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name tg-proxy-ci --network none \
            -e TG_WS_PROXY_HOST=127.0.0.1 -e TG_WS_PROXY_DC_IPS= tg-proxy-ci-local \
            --no-cfproxy --pool-size 0 --dc-ip
          ready=no
          for attempt in $(seq 1 12); do
            if docker exec tg-proxy-ci python -c 'import socket; socket.create_connection(("127.0.0.1", 1443), timeout=0.5).close()'; then
              ready=yes
              break
            fi
            sleep 1
          done
          test "$ready" = yes
          docker logs tg-proxy-ci > "$RUNNER_TEMP/docker-smoke.log" 2>&1
          if grep -Eqi 'secret[=:][[:space:]]*(dd|ee)?[[:xdigit:]]{32}' "$RUNNER_TEMP/docker-smoke.log"; then
            echo "Connection information was written to the startup log"
            exit 1
          fi

  project-ci:
    name: Project CI gate
    if: always()
    needs: [tests, android-core, release-verifier, build-windows, worker, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every project check to complete successfully
        env:
          CHECK_RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'length == 6 and all(.[]; . == "success")' <<< "$CHECK_RESULTS"
